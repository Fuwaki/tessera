[package]
name = "tessera"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "An extensible hardware-aware compiler for quantized neural networks on FPGAs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# In-process CP-SAT backend for `src/solver/`. Pinned exactly: the FFI C API and
# the protos vendored by the crate are OR-Tools release specific, so a range
# would silently mix an API with a different model schema. Requires an OR-Tools
# C++ 9.15 installation plus `protoc` at build time (see
# docs/developer-setup.md); the default build therefore needs both.
cpsat-rs = "=0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# In-process MLIR. Pinned exactly: both the pass names and the Melior API used
# by `src/mlir/` are release specific. Requires an LLVM/MLIR 23.x installation
# discoverable through `MLIR_SYS_230_PREFIX` / `TABLEGEN_230_PREFIX` (see
# docs/developer-setup.md).
melior = "=0.28.2"
# CIRCT C API (hw/comb/seq/sv/esi + ExportVerilog), linked into the same MLIR.
circt-sys = { path = "../circt-sys" }
mlir-sys = "=230.0.2"

[[bin]]
name = "tessera"
path = "src/main.rs"
